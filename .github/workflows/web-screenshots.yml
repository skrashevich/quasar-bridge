name: web panel screenshots

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build Quasar Bridge
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o "$RUNNER_TEMP/quasar-bridge" ./cmd/quasar-bridge
      - name: Install Chromium
        working-directory: scripts/web-screenshots
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Capture live web panel
        working-directory: scripts/web-screenshots
        run: node capture.mjs "$RUNNER_TEMP/quasar-bridge" "$RUNNER_TEMP/web-panel-screenshots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-panel-screenshots
          path: ${{ runner.temp }}/web-panel-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
