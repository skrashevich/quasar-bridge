name: station emulator

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: kuyase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config
          rustup toolchain install stable --profile minimal
      - name: Build kuyase 1.5.0 headless for Ubuntu 24.04
        run: bash scripts/kuyase/build-emulator.sh "$RUNNER_TEMP/kuyase-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kuyase-emulator
          path: |
            ${{ runner.temp }}/kuyase-build/kuyase
            ${{ runner.temp }}/kuyase-build/qemu-hw-bridge
            ${{ runner.temp }}/kuyase-build/kuyase-kernel-arm64.img
          if-no-files-found: error
          retention-days: 3

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test E2E controller and backend fixtures
        run: go test -race ./scripts/kuyase/control -count=1 -timeout=60s
      - name: Test emulator preparation diagnostics
        run: python3 -m unittest discover -s scripts/kuyase -p 'test_*.py'
      - name: Build standalone packages and guest controller
        run: |
          for arch in arm64 armv7; do
            python3 scripts/build-speaker-package.py --arch "$arch"
          done
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/kuyase-control ./scripts/kuyase/control
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kuyase-build
          path: |
            dist/quasar-bridge-linux-*.tar.gz
            dist/kuyase-control
          if-no-files-found: error
          retention-days: 3

  emulator:
    name: E2E (${{ matrix.board }}, ${{ matrix.arch }})
    needs: [build, build-emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        board: [yandexmini, station2]
        arch: [arm64, armv7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kuyase-build
          path: dist
      - name: Install emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm ipxe-qemu adb
          python3 -m venv "$RUNNER_TEMP/kuyase-venv"
          "$RUNNER_TEMP/kuyase-venv/bin/pip" install ubi-reader==0.8.16
      - name: Download Ubuntu-built kuyase
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kuyase-emulator
          path: ${{ runner.temp }}/kuyase
      - name: Check emulator compatibility
        run: |
          chmod 755 "$RUNNER_TEMP/kuyase/kuyase" "$RUNNER_TEMP/kuyase/qemu-hw-bridge"
          "$RUNNER_TEMP/kuyase/kuyase" --help
      - name: Prepare pinned station firmware
        env:
          BOARD: ${{ matrix.board }}
        run: |
          "$RUNNER_TEMP/kuyase-venv/bin/python" scripts/kuyase/prepare.py \
            --board "$BOARD" --emulator-dir "$RUNNER_TEMP/kuyase" \
            --output "$RUNNER_TEMP/kuyase-input"
      - name: Run core function E2E scenarios in station VM
        env:
          BOARD: ${{ matrix.board }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/kuyase/run.py --board "$BOARD" --arch "$PACKAGE_ARCH" \
            --emulator-dir "$RUNNER_TEMP/kuyase" --build-dir dist \
            --output "dist/kuyase-results/$BOARD-$PACKAGE_ARCH"
      - name: Keep emulator diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kuyase-${{ matrix.board }}-${{ matrix.arch }}-logs
          path: |
            dist/kuyase-results/
            ${{ runner.temp }}/kuyase-input/prepare.log
          if-no-files-found: warn
          retention-days: 7
