name: checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      upload-speaker:
        description: Keep the tested standalone speaker archives for the release job
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tag must be vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: python3 scripts/check-public-tree.py
      - run: go test -race ./... -count=1 -timeout=60s
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/quasar-bridge ./cmd/quasar-bridge
      - name: Check shell syntax
        run: |
          for script in install.sh packaging/speaker/*.sh packaging/speaker/S96quasar-bridge; do
            sh -n "$script"
          done
      - name: Test standalone installation with BusyBox
        run: |
          docker run --rm -v "$PWD:/src:ro" -v /tmp/quasar-bridge:/test-binary:ro \
            -e QUASAR_TEST_BINARY=/test-binary -w /src python:3.13-alpine \
            python3 scripts/test-speaker-package.py
      - name: Install UPX 5.2.1
        shell: bash
        run: |
          archive="$RUNNER_TEMP/upx-5.2.1-amd64_linux.tar.xz"
          curl --fail --location --retry 3 \
            https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-amd64_linux.tar.xz \
            --output "$archive"
          echo "402162aad30af47e60dbd767fb2e64ca394ace9727ba1f40283641f1d1b91657  $archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/upx-5.2.1-amd64_linux" >> "$GITHUB_PATH"
      - name: Build UPX-compressed standalone speaker archives
        shell: bash
        run: |
          for arch in arm64 armv7; do
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              python3 scripts/build-speaker-package.py --arch "$arch" --upx --tag "$GITHUB_REF_NAME"
            else
              python3 scripts/build-speaker-package.py --arch "$arch" --upx
            fi
          done
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 scripts/build-source-package.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/build-source-package.py
          fi
          cp install.sh dist/install.sh
      - name: Keep release assets
        if: inputs.upload-speaker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speaker-release
          path: |
            dist/install.sh
            dist/quasar-bridge-source.tar.gz
            dist/quasar-bridge-source.tar.gz.sha256
            dist/quasar-bridge-linux-arm64.tar.gz
            dist/quasar-bridge-linux-arm64.tar.gz.sha256
            dist/quasar-bridge-linux-armv7.tar.gz
            dist/quasar-bridge-linux-armv7.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
