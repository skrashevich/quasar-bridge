paths:
  /diagnostics/api/status:
    get:
      tags:
      - Panel
      operationId: getPanelStatus
      summary: Состояние Bridge и возможности панели
      description: Проверяйте capabilities перед вызовом необязательной подсистемы. history=true означает настроенный
        путь журнала, даже если запись сейчас выключена.
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /diagnostics/api/config:
    get:
      tags:
      - Panel
      operationId: getConfiguration
      summary: Прочитать безопасный список настроек
      description: Возвращает только разрешённые 48 настроек, без токенов, URL серверов и путей файлов. Пустая
        section означает все настройки; доступны точный путь и префикс секции.
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: section
        in: query
        required: false
        description: Например routing, routing.classifier или diagnostics.network_access. Неизвестная секция
          — 400.
        schema:
          type: string
    post:
      tags:
      - Panel
      operationId: saveConfiguration
      summary: Сохранить изменения конфигурации
      description: Атомарная запись и резервная копия .voice-backup; сама по себе не применяет изменения. Переменные
        окружения делают соответствующие поля недоступными для записи. Для применения используйте /apply.
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      requestBody:
        required: true
        description: 'Content-Type: application/json (параметры, например charset, допустимы); максимум 262144
          байт, чтение до 10 секунд; неизвестные поля отклоняются.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationRequest'
            example:
              changes:
                diagnostics.network_access: true
                routing.classifier.enabled: false
                routing.default_route: yandex
      x-max-request-body-bytes: 262144
  /diagnostics/api/apply:
    post:
      tags:
      - Panel
      operationId: applyConfiguration
      summary: Применить настройки или запланировать перезапуск
      description: reload применяет routing, conversation_log и diagnostics.network_access. Если остальная
        конфигурация изменилась, возвращает 409 restart required. restart планирует перезапуск проверенной
        standalone-службы; 200 со status=scheduled не означает завершения перезапуска.
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ConfigurationResult'
                - $ref: '#/components/schemas/RestartResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      requestBody:
        required: true
        description: 'Content-Type: application/json (параметры, например charset, допустимы); максимум 262144
          байт, чтение до 10 секунд; неизвестные поля отклоняются.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
            example:
              action: reload
      x-max-request-body-bytes: 262144
  /diagnostics/api/route:
    post:
      tags:
      - Panel
      operationId: previewRouting
      summary: Сравнить статические маршруты активной и сохранённой конфигурации
      description: Не вызывает классификатор и не выполняет действие. Проверяет статические правила и администрирование
        Bridge; специальные обработчики media/dialogue не симулируются. wake word в HTTP-запросе не принимается.
        route=classify означает необходимость классификации при реальном запросе.
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePreview'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      requestBody:
        required: true
        description: 'Content-Type: application/json (параметры, например charset, допустимы); максимум 262144
          байт, чтение до 10 секунд; неизвестные поля отклоняются.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextRequest'
      x-max-request-body-bytes: 262144
  /diagnostics/api/decide:
    post:
      tags:
      - Panel
      operationId: decideRouting
      summary: Выбрать маршрут через работающий Engine
      description: 'Аналог CLI -route: специальные обработчики, контекст диалога и fallback классификатора.
        Может вызвать LLM-классификатор, но не генерирует ответ и не выполняет выбранное действие. Тайм-аут
        75 секунд. Общая блокировка с /query, конфликт — 409; fallback при ошибке классификации может вернуть
        обычный 200.'
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveDecision'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      requestBody:
        required: true
        description: 'Content-Type: application/json (параметры, например charset, допустимы); максимум 262144
          байт, чтение до 10 секунд; неизвестные поля отклоняются.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextRequest'
      x-max-request-body-bytes: 262144
  /diagnostics/api/query:
    post:
      tags:
      - Panel
      operationId: executeTextQuery
      summary: Выполнить текстовый запрос
      description: >-
        Тайм-аут 75 секунд. Может выполнять инструменты и менять состояние устройств или аккаунта.
        Маршрут yandex получает текст Алисы через отдельное соединение без микрофона и озвучивания.
        Без dialog_id создаётся новый диалог; UUID из ответа передаётся в следующих запросах для
        сохранения контекста Алисы, LLM или обработчика умного дома. При включённом
        dialogue_context.enabled короткие уточнения продолжают последний локальный обработчик;
        после уточняющего вопроса умного дома ближайшая реплика в течение 45 секунд
        также может быть ответом в свободной форме. Явные правила маршрутизации имеют приоритет.
        Перед действием умный дом перечитывает
        доступность и состояния устройств. Разные диалоги изолированы от колонок и друг друга.
        Неактивные диалоги истекают по dialogue_context.ttl_seconds (по умолчанию 300 секунд),
        перезапуск процесса удаляет их. До 32 активных диалогов. Общая блокировка с /decide.
        Физическое воспроизведение симулируется и возвращается в playback; прочие действия реальны.
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Неизвестный или истёкший dialog_id. Не создаёт новый диалог молча.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      requestBody:
        required: true
        description: 'Content-Type: application/json (параметры, например charset, допустимы); максимум 262144
          байт, чтение до 10 секунд; неизвестные поля отклоняются.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            examples:
              newDialog:
                summary: Начать новый диалог
                value:
                  text: Какая погода в Токио?
              continueDialog:
                summary: Продолжить диалог с UUID из предыдущего ответа
                value:
                  text: А завтра?
                  dialog_id: 9e069ed0-af1a-40cd-b072-420e3db3cd15
      x-max-request-body-bytes: 262144
  /diagnostics/api/history:
    get:
      tags:
      - Panel
      operationId: searchHistory
      summary: Поиск в журнале диалогов
      description: Чтение до 5 секунд, лимит объёма assistant_tools.history_max_scan_mb. Все слова query ищутся
        без учёта регистра в вопросе и ответе, ё=е. Результаты от новых к старым. Можно читать существующий
        журнал при выключенной записи; recording отражает её текущее состояние.
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: query
        in: query
        required: false
        description: Поисковая строка, максимум 200 Unicode code points.
        schema:
          type: string
          maxLength: 200
          default: ''
      - name: limit
        in: query
        required: false
        description: Количество результатов.
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
      - name: since
        in: query
        required: false
        description: Нижняя граница включительно, RFC3339.
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        required: false
        description: Верхняя граница исключительно, RFC3339; строго позже since.
        schema:
          type: string
          format: date-time
  /diagnostics/api/airplay:
    post:
      tags:
      - Panel
      operationId: controlAirPlay
      summary: Управление приёмником и отправителем AirPlay
      description: Тайм-аут 15 секунд. start/stop/status управляют приёмником. restart — медиакоманда для текущего
        отправителя, не перезапуск Bridge или приёмника. media_stop отправляет отправителю команду stop. Медиакоманды
        требуют подключённого отправителя; любая ошибка Control/ControlMedia возвращает 409.
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirPlayResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      requestBody:
        required: true
        description: 'Content-Type: application/json (параметры, например charset, допустимы); максимум 262144
          байт, чтение до 10 секунд; неизвестные поля отклоняются.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AirPlayRequest'
            example:
              action: status
      x-max-request-body-bytes: 262144
  /diagnostics/logs:
    get:
      tags:
      - Diagnostics
      operationId: getOperationalLogs
      summary: Получить хвост операционного журнала
      description: Для инкрементального чтения передайте run и cursor предыдущего ответа как after. Без совпадающего
        run after игнорируется. cursor — смещение в байтах; вытесненные или выходящие за конец курсоры сбрасываются.
        reset описывает коррекцию курсора, truncated — обрезанный буфер, а не историю диалогов.
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogSnapshot'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '400':
          description: Invalid log cursor
          content:
            text/plain:
              schema:
                type: string
      parameters:
      - name: run
        in: query
        required: false
        description: ID процесса из предыдущего ответа.
        schema:
          type: string
      - name: after
        in: query
        required: false
        description: Курсор в байтах; проверяется только при совпавшем run.
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
  /diagnostics/download:
    get:
      tags:
      - Diagnostics
      operationId: downloadOperationalLogs
      summary: Скачать диагностический отчёт
      description: 'Текстовый файл: версия, UTC-время выгрузки, признак обрезки, состояние AirPlay и хвост
        операционного журнала.'
      responses:
        '200':
          description: Текстовый диагностический отчёт.
          content:
            text/plain:
              schema:
                type: string
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="quasar-bridge-diagnostics-20261115-120000.txt"
        '403':
          $ref: '#/components/responses/Forbidden'
