      description: 'Плоский объект: ключи — разрешённые пути с точками, а не вложенные секции. Проверяется
        весь получившийся конфиг; взаимозависимые параметры меняйте одной транзакцией. null допустим только
        для двух необязательных AirPlay-параметров. Числовые ограничения заданы в свойствах. Пропущенный путь
        сохраняет прежнее значение; явный ноль не подставляет значение по умолчанию.'
