  /music-stream/{stream_id}:
    get:
      tags:
      - Bridge
      operationId: streamMusic
      summary: MP3-поток очереди
      description: Только основной listener, только при созданной MusicQueue (assistant_tools.enabled, web,
        play_sound и доступный music_base_url). На порту панели отсутствует. Идентификатор выдаётся внутренним
        playback; REST-метода создания очереди нет. 1..64 трека; Range не поддерживается. Неизвестные query-параметры
        игнорируются. Ошибка после начала потока передаётся HTTP trailer X-Quasar-Music-Error при статусе 200.
      responses:
        '200':
          description: MP3-поток.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Accept-Ranges:
              schema:
                type: string
                const: none
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '400':
          description: Неверный start, offset_ms либо повтор параметра.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Очередь неизвестна, истекла либо MusicQueue не зарегистрирована.
          content:
            text/plain:
              schema:
                type: string
        '502':
          description: Ошибка источника до начала MP3-потока.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: Четыре потока уже активны.
          content:
            text/plain:
              schema:
                type: string
          headers:
            Retry-After:
              schema:
                type: string
                const: '1'
      parameters:
      - name: stream_id
        in: path
        required: true
        description: Полученный ранее ID очереди; истекает через 2 часа.
        schema:
          type: string
          description: Непрозрачный идентификатор UUID с суффиксом .mp3.
      - name: start
        in: query
        required: false
        description: Индекс трека с нуля; меньше числа треков очереди; повтор параметра запрещён.
        schema:
          type: integer
          minimum: 0
          maximum: 63
          default: 0
      - name: offset_ms
        in: query
        required: false
        description: Смещение в первом выбранном треке, максимум 2 часа; повтор параметра запрещён.
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 7200000
          default: 0
      servers:
      - url: '{scheme}://{host}:{port}'
        description: Только основной listener Bridge (listen, TLS и allowed_ips). На порту панели маршрут отсутствует.
        variables:
          scheme:
            default: http
            enum:
            - http
            - https
          host:
            default: localhost
            description: Числовой IP или localhost.
          port:
            default: '8443'
            description: Порт из listen; TLS при настроенных tls_cert/tls_key.
      x-http-trailers:
        X-Quasar-Music-Error:
          description: Ошибка после отправки 200; тело может быть неполным MP3.
          schema:
            type: string
    head:
      tags:
      - Bridge
      operationId: getMusicStreamHeaders
      summary: Заголовки MP3-потока
      description: Только основной listener, только при созданной MusicQueue (assistant_tools.enabled, web,
        play_sound и доступный music_base_url). На порту панели отсутствует. Идентификатор выдаётся внутренним
        playback; REST-метода создания очереди нет. 1..64 трека; Range не поддерживается. Неизвестные query-параметры
        игнорируются. Ошибка после начала потока передаётся HTTP trailer X-Quasar-Music-Error при статусе 200.
      responses:
        '200':
          description: Только заголовки, без получения аудио от источников.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Accept-Ranges:
              schema:
                type: string
                const: none
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '400':
          description: Неверный start, offset_ms либо повтор параметра.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Очередь неизвестна, истекла либо MusicQueue не зарегистрирована.
          content:
            text/plain:
              schema:
                type: string
      parameters:
      - name: stream_id
        in: path
        required: true
        description: Полученный ранее ID очереди; истекает через 2 часа.
        schema:
          type: string
          description: Непрозрачный идентификатор UUID с суффиксом .mp3.
      - name: start
        in: query
        required: false
        description: Индекс трека с нуля; меньше числа треков очереди; повтор параметра запрещён.
        schema:
          type: integer
          minimum: 0
          maximum: 63
          default: 0
      - name: offset_ms
        in: query
        required: false
        description: Смещение в первом выбранном треке, максимум 2 часа; повтор параметра запрещён.
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 7200000
          default: 0
      servers:
      - url: '{scheme}://{host}:{port}'
        description: Только основной listener Bridge (listen, TLS и allowed_ips). На порту панели маршрут отсутствует.
        variables:
          scheme:
            default: http
            enum:
            - http
            - https
          host:
            default: localhost
            description: Числовой IP или localhost.
          port:
            default: '8443'
            description: Порт из listen; TLS при настроенных tls_cert/tls_key.
  /uni.ws:
    get:
      tags:
      - Bridge
      servers:
      - url: '{scheme}://{host}:{port}'
        description: Только основной listener Bridge (listen, TLS и allowed_ips). На порту панели маршрут отсутствует.
        variables:
          scheme:
            default: http
            enum:
            - http
            - https
          host:
            default: localhost
            description: Числовой IP или localhost.
          port:
            default: '8443'
            description: Порт из listen; TLS при настроенных tls_cert/tls_key.
      operationId: upgradeUniProxy
      summary: WebSocket UniProxy
      description: HTTP Upgrade к бинарному протоколу колонки, только основной listener. Все query-параметры
        и заголовки, кроме hop-by-hop WebSocket-заголовков передаются upstream. Согласование Sec-WebSocket-Protocol
        с upstream; тайм-аут upstream dial 15 секунд. Лимит сообщения 8 МиБ. OpenAPI описывает только HTTP
        handshake, не сообщения WebSocket/Protobuf. Origin проверяет websocket.Accept (тот же Host либо hostname
        upstream).
      x-protocol: websocket
      responses:
        '101':
          description: 'Switching Protocols: установлен WebSocket.'
        '400':
          description: Неверный WebSocket handshake, включая неподдерживаемый Sec-WebSocket-Version (требуется
            13).
          content:
            text/plain:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '426':
          description: 'Требуется HTTP/1.1 и заголовки Connection: Upgrade, Upgrade: websocket.'
          content:
            text/plain:
              schema:
                type: string
        '502':
          description: invalid upstream или upstream unavailable.
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      additionalProperties: false
    TextRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 8000
          pattern: \S
          description: Непустой после TrimSpace текст, не более 8000 Unicode code points.
      required:
      - text
      additionalProperties: false
    QueryRequest:
      type: object
      properties:
        text:
          $ref: '#/components/schemas/TextRequest/properties/text'
        dialog_id:
          type: string
          oneOf:
          - format: uuid
            minLength: 1
          - const: ''
          description: UUID из предыдущего ответа query. Если отсутствует или пуст, начинается новый диалог.
      required:
      - text
      additionalProperties: false
    RouteDecision:
      type: object
      properties:
        route:
          type: string
          description: Например yandex, llm, home, classify, airplay, music, playback, recovery или diagnostics;
            набор зависит от обработчика.
        rule:
          type: string
          description: Имя совпавшего правила; опускается, если пусто.
        source:
          type: string
      required:
      - route
      - source
    RoutePreview:
      type: object
      properties:
        active:
          $ref: '#/components/schemas/RouteDecision'
        saved:
          $ref: '#/components/schemas/RouteDecision'
        classifier_called:
          type: boolean
          const: false
        scope:
          type: string
      required:
      - active
      - saved
      - classifier_called
      - scope
    LiveDecision:
      allOf:
      - $ref: '#/components/schemas/RouteDecision'
      - type: object
        properties:
          elapsed_ms:
            type: integer
            format: int64
            minimum: 0
        required:
        - elapsed_ms
    WebLink:
      type: object
      properties:
        url:
          type: string
          format: uri
        title:
          type: string
      required:
      - url
    Playback:
      type: object
      properties:
        sound:
          type: string
        url:
          type: string
        command:
          type: string
        stream_id:
          type: string
        title:
          type: string
        offset_ms:
          type: integer
          format: int64
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/WebLink'
      description: Захваченный sound.Request. Пустые строки, нулевой offset_ms и пустой tracks опускаются.
    QueryResult:
      type: object
      properties:
        dialog_id:
          type: string
          format: uuid
          description: Локальный идентификатор Bridge; служебный контекст Яндекса не раскрывается.
        route:
          type: string
        answer:
          type: string
        elapsed_ms:
          type: integer
          format: int64
          minimum: 0
        playback:
          type: array
          items:
            $ref: '#/components/schemas/Playback'
        playback_simulated:
          type: boolean
          const: true
          description: Присутствует только при непустом playback.
      required:
      - dialog_id
      - route
      - answer
      - elapsed_ms
    AirPlayHealth:
      type: object
      properties:
        enabled:
          type: boolean
        state:
          type: string
          description: Состояние приёмника station-airplay; при отсутствии приёмника stopped.
        name:
          type: string
        address:
          type: string
        error:
          type: string
        connected:
          type: boolean
        playing:
          type: boolean
        volume_db:
          type: number
      required:
      - enabled
      - state
      description: При отсутствии приёмника только enabled=false и state=stopped. При наличии остальные поля
        также присутствуют, включая пустой error.
    AirPlayRequest:
      type: object
      properties:
        action:
          anyOf:
          - type: string
            enum:
            - start
            - stop
            - status
            - pause
            - resume
            - next
            - previous
            - restart
            - volume_up
            - volume_down
            - media_stop
          - type: string
            pattern: ^volume:(?:[+]?0*(?:[0-9]|[1-9][0-9]|100)|-0+)$
            description: volume:<целое 0..100>; проверяется численно, ведущие нули допустимы.
      required:
      - action
      additionalProperties: false
    AirPlayResult:
      type: object
      properties:
        message:
          type: string
        airplay:
          $ref: '#/components/schemas/AirPlayHealth'
      required:
      - message
      - airplay
    HistoryItem:
      type: object
      properties:
        time:
          type: string
          format: date-time
        query:
          type: string
        answer:
          type: string
        route:
          type: string
        status:
          type: string
      required:
      - time
      - query
      - answer
    HistoryResult:
      type: object
      properties:
        timezone:
          type: string
          description: Часовой пояс assistant_tools.timezone; timestamps time сохраняют RFC3339.
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
        partial:
          type: boolean
          const: true
          description: Присутствует только если история прочитана частично.
        recording:
          type: boolean
      required:
      - items
      - recording
    ConfigurationResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - saved
          - applied
        changed:
          type: array
          items:
            type: string
        pending:
          type: array
          items:
            type: string
        restart_required:
          type: boolean
        restart_scheduled:
          type: boolean
      required:
      - status
      - pending
      - restart_required
      - restart_scheduled
    RestartResult:
      type: object
      properties:
        status:
          type: string
          const: scheduled
        message:
          type: string
      required:
      - status
      - message
    Setting:
      type: object
      properties:
        path:
          type: string
        description:
          type: string
        environment:
          type: string
          description: Имя переменной окружения; опускается при отсутствии.
        restart_required:
          type: boolean
        active: {}
        saved: {}
        effective: {}
        pending:
          type: boolean
        writable:
          type: boolean
      required:
      - path
      - description
      - restart_required
      - active
      - saved
      - effective
      - pending
      - writable
      description: Значения — произвольный JSON, включая null для отсутствующего saved. writable=false при
        переопределении переменной окружения. effective учитывает значения по умолчанию и окружение.
    ConfigurationView:
      allOf:
      - $ref: '#/components/schemas/ConfigurationResult'
      - type: object
        properties:
          settings:
            type: array
            items:
              $ref: '#/components/schemas/Setting'
        required:
        - settings
    RoutingMatch:
      type: object
      properties:
        wake_words:
          type: array
          items:
            type: string
        contains_any:
          type: array
          items:
            type: string
        contains_none:
          type: array
          items:
            type: string
        starts_with_any:
          type: array
          items:
            type: string
        contains_all_groups:
          type: array
          items:
            type: array
            items:
              type: string
            minItems: 1
        regex:
          type: string
          description: Регулярное выражение Go RE2; компилируется с (?i).
      additionalProperties: false
      description: 'Нужно хотя бы одно непустое положительное условие: wake_words, contains_any, contains_all_groups,
        starts_with_any или regex. contains_none само по себе недостаточно. Условия объединяются AND; элементы
        contains_any/starts_with_any — OR. wake_words содержит ID station-wakeword.'
      anyOf:
      - required:
        - wake_words
        properties:
          wake_words:
            minItems: 1
      - required:
        - contains_any
        properties:
          contains_any:
            minItems: 1
      - required:
        - contains_all_groups
        properties:
          contains_all_groups:
            minItems: 1
      - required:
        - starts_with_any
        properties:
          starts_with_any:
            minItems: 1
      - required:
        - regex
        properties:
          regex:
            minLength: 1
    RoutingRule:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
          description: Уникальное непустое имя.
        route:
          type: string
          enum:
          - yandex
          - llm
          - home
        disabled:
          type: boolean
        match:
          $ref: '#/components/schemas/RoutingMatch'
      required:
      - name
      - route
      - match
      additionalProperties: false
    ConfigurationChanges:
      type: object
      properties:
        mode:
          type: string
          description: 'Режим Bridge: observe передаёт запросы Яндексу; hybrid включает локальные маршруты
            и LLM и требует настроенные llm_base_url и llm_model. Смена режима требует перезапуска. Пустая
            строка нормализуется в observe.'
          x-restart-required: true
          x-environment: QUASAR_MODE
          enum:
          - ''
          - observe
          - hybrid
        diagnostics.network_access:
          type: boolean
          description: 'Логическое: разрешить доступ к веб-панели диагностики по сети. По умолчанию false:
            доступ только через localhost. Применяется reload без перезапуска.'
          x-restart-required: false
        llm_model:
          type: string
          description: Модель LLM; непустая строка в hybrid. Наличие модели на сервере отдельно не проверяется.
          x-restart-required: true
          x-environment: QUASAR_LLM_MODEL
        llm_api:
          type: string
          description: 'API: chat_completions, responses или chatgpt. Зависимые параметры меняй одним вызовом.
            Пустая строка нормализуется в chat_completions.'
          x-restart-required: true
          x-environment: QUASAR_LLM_API
          enum:
          - ''
          - chat_completions
          - responses
          - chatgpt
        llm_reasoning_effort:
          type: string
          description: 'Усилие рассуждения: пустая строка, none, minimal, low, medium, high, xhigh, max; только
            responses/chatgpt.'
          x-restart-required: true
          x-environment: QUASAR_LLM_REASONING_EFFORT
          enum:
          - ''
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
        llm_max_output_tokens:
          type: integer
          description: 'Лимит выходных токенов: положительное целое число.'
          x-restart-required: true
          minimum: 1
        llm_hosted_tools:
          type: array
          items:
            type: string
            enum:
            - web_search
            - code_interpreter
          description: 'Массив серверных инструментов: web_search, code_interpreter для responses; для chatgpt
            только web_search; [] отключает.'
          x-restart-required: true
          uniqueItems: true
        llm_chat_parameters:
          type: object
          properties:
            temperature: {}
            max_tokens: {}
            max_completion_tokens: {}
            response_format: {}
            chat_template_kwargs: {}
            reasoning_effort: {}
          additionalProperties: false
          description: 'Объект параметров chat_completions: temperature, max_tokens, max_completion_tokens,
            response_format, chat_template_kwargs, reasoning_effort. {} очищает.'
          x-restart-required: true
          x-environment: QUASAR_LLM_CHAT_PARAMETERS
        llm_strip_prefixes:
