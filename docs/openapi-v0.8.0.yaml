      - run
      - cursor
      - reset
      - truncated
      - text
      - version
      - airplay
  responses:
    Forbidden:
      description: 'Проверка доступа отклонила запрос: адрес клиента, Host, Origin, Sec-Fetch-Site либо allowed_ips
        основного listener.'
      content:
        text/plain:
          schema:
            type: string
    BadRequest:
      description: Неверные параметры, JSON, неизвестные поля, недопустимая конфигурация либо ошибка чтения/валидации.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Занят диагностический запрос, конфликт состояния, внешнее изменение конфигурации, необходим
        перезапуск либо ошибка управления AirPlay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Подсистема недоступна либо действие требует standalone-установки.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Timeout:
      description: Истёк тайм-аут операции.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Cannot encode response — ошибка JSON-сериализации.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Request body exceeds 256 KiB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Content-Type must be application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Diagnostic query failed; inspect the operational log
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: Метод не поддерживается. GET-маршруты ServeMux также обслуживают HEAD.
      content:
        text/plain:
          schema:
            type: string
      headers:
        Allow:
          schema:
            type: string
          description: Разрешённые методы.
