# Контракт ветки cdx/yandex-text-query; см. info.description и x-source-commit.
openapi: 3.1.0
info:
  title: Quasar Bridge — внешние HTTP API и веб-панель
  version: 0.8.0-prerelease
  description: |-
    Контракт реализации ветки cdx/yandex-text-query (commit 935421954765cd61c29710ee16358362db9896b5).
    Основан на предрелизе v0.8.0 и дополнен текстовыми ответами Алисы и диалогами в API.

    Основной набор — 9 JSON-операций /diagnostics/api/*, а также /diagnostics/logs и /diagnostics/download.
    Для полного описания HTTP-поверхности добавлены HTML/JS/CSS, перенаправления панели и маршруты
    основного listener: /healthz, /music-stream/{stream_id}, /uni.ws (только handshake).
    На отдельном HTTP-порту панели (по умолчанию 2704) доступны только /diagnostics* и GET /.
    Те же /diagnostics* зарегистрированы на основном listener Bridge (по умолчанию localhost:8443),
    где дополнительно действует allowed_ips. TLS относится к основному listener, панель использует HTTP.

    Включение сетевого доступа: diagnostics.network_access=true, затем apply reload; отдельный listener
    перепривязывается с 127.0.0.1 на 0.0.0.0. При false панель продолжает работать через loopback.
    Bearer/API key/cookie-аутентификации в реализации нет, поэтому securitySchemes отсутствует.
    Проверки /diagnostics*: Host — числовой IP или localhost; при выключенном сетевом доступе и peer,
    и Host должны быть loopback. Origin, если указан, должен в точности совпадать со scheme://Host
    текущего запроса; Sec-Fetch-Site: cross-site запрещён. CORS preflight не реализован.
    X-Forwarded-* не участвуют в проверке; произвольные DNS-имена Host не принимаются.
    Успешно прошедшие guard ответы имеют Cache-Control: no-store, X-Content-Type-Options: nosniff
    и ограничительный Content-Security-Policy. Ошибки guard и ServeMux — text/plain, ошибки API — JSON.

    Все POST принимают application/json с параметрами, тело до 256 КиБ; неизвестные JSON-поля запрещены.
    Схемы required описывают корректный клиентский запрос; Go-декодер отдельно не проверяет наличие
    каждого поля: отсутствующие строки становятся пустыми и отклоняются последующей валидацией.
    GET-маршруты ServeMux также принимают HEAD; кроме потока, HEAD отдельно не перечислены.
    Неподдерживаемый метод обычно получает 405; неизвестный путь — 404, оба text/plain.
    Это статический документ: v0.8.0 не публикует /openapi.yaml или Swagger UI.
    OAuth callback CLI, исходящие API провайдеров/MCP и протокол AirPlay не относятся к этому HTTP-серверу.
  contact:
    url: https://github.com/skrashevich/quasar-bridge
  license:
    name: Apache-2.0
    url: https://github.com/skrashevich/quasar-bridge/blob/v0.8.0/LICENSE
externalDocs:
  description: Исходники реализации текстовых запросов и диалогов
  url: https://github.com/skrashevich/quasar-bridge/tree/935421954765cd61c29710ee16358362db9896b5
servers:
- url: http://{host}:{port}
  description: Отдельный HTTP listener панели. diagnostics.network_access=true открывает IPv4 0.0.0.0; false
    оставляет 127.0.0.1.
  variables:
    host:
      default: 127.0.0.1
      description: Числовой IP или localhost. Для сетевого доступа укажите IP колонки.
    port:
      default: '2704'
      description: diagnostics.port
- url: '{scheme}://{host}:{port}'
  description: 'Основной listener Bridge: те же маршруты панели, дополнительно действует allowed_ips.'
  variables:
    scheme:
      default: http
      enum:
      - http
      - https
    host:
      default: localhost
      description: Числовой IP или localhost.
    port:
      default: '8443'
      description: Порт из listen; TLS при настроенных tls_cert/tls_key.
security: []
tags:
- name: Panel
  description: JSON API веб-панели.
- name: Diagnostics
  description: Операционный журнал и выгрузка.
- name: UI
  description: Статические файлы и перенаправления панели.
- name: Bridge
  description: 'Основной listener: health, музыка и WebSocket.'
